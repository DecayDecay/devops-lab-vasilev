site_name: Антон Васильев — Персональный сайт
site_description: Персональный сайт студента — проекты, навыки и контакты
site_author: Anton Vasilev
site_url: https://antonvasilev.github.io/my-personal-site/

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  logo: images/b0bf05d91511482d94e23ef58f56014a57c9a5087ba9ed659eeb31d20e956e26i0.png

nav:
  - Главная: index.md
  - О себе: about.md
  - Проекты: projects.md
  - Резюме: resume.md
  - Контакты: contacts.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/decaydecay
    - icon: fontawesome/brands/telegram
      link: https://t.me/antonvasilev

copyright: "&copy; 2026 Антон Васильев. Все права защищены."
